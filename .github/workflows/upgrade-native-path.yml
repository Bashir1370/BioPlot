name: Implement editable path editor
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-native-path.yml
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate canvas nodes and events with exact source anchors
        run: python3 scripts/apply_native_path_editor.py
      - name: Integrate inspector and admin native preset builder
        run: python3 scripts/apply_native_path_controls.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Native path regression tests
        run: npm test -- src/native-line-path.test.ts
      - name: Commit verified editor changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EditorStudio.tsx src/EditorInspector.tsx src/AdminLinesPage.tsx src/lineGeometry.ts
          if ! git diff --cached --quiet; then
            git commit -m "Integrate editable multi-node curves, contextual line editor and admin presets"
            git push origin HEAD:main
          fi
