name: Align arrow tips and add icon pickers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-arrowheads.yml
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply precise arrowhead geometry and graphical pickers
        run: python3 scripts/fix_arrowheads_and_icon_pickers.py
      - name: Check tip endpoint rather than SVG subpath start in regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/line-heads.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'expect(svg).toContain(`M${tipX},${tipY}`);'
          assert text.count(old) == 1, 'Tip assertion must occur exactly once'
          path.write_text(text.replace(old, 'expect(svg).toContain(`L${tipX},${tipY}`);'), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit tested editor changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model.ts src/lineGeometry.ts src/NativePathControls.tsx src/native-path-controls.css src/line-heads.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Align line arrowheads with endpoints and offer illustrated start/end icons"
            git push origin HEAD:main
          fi
