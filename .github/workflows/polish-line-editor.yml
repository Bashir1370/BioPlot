name: Stabilize line node dragging
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-line-editor.yml
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-anchor stability fix without overwriting other editor code
        run: python3 scripts/stabilize_line_drag.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit only validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EditorStudio.tsx src/line-polish.css src/linePointer.ts src/linePointer.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Stabilize line nodes when dragging and moving paths"
            git push origin HEAD:main
          fi
