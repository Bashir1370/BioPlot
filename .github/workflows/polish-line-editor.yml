name: Polish line editing UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-line-editor.yml
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-anchor changes without overwriting other editor code
        run: python3 scripts/polish_line_editor.py
      - name: Install project dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run full unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit only validated polish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EditorStudio.tsx src/EditorInspector.tsx src/EditorObjectView.tsx src/NativePathControls.tsx src/line-polish.css src/line-polish.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Polish editable lines: slim controls, orthogonal endpoint drag and rotation"
            git push origin HEAD:main
          fi
