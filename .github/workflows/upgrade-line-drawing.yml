name: Apply editable line drawing
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_line_drawing.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply strictly anchored source edits
        run: python3 scripts/apply_line_drawing.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EditorStudio.tsx src/EditorObjectView.tsx src/EditorInspector.tsx src/VectorStudio.tsx src/export.ts
          if ! git diff --cached --quiet; then
            git commit -m "Implement in-canvas editable line drawing, endpoint handles and independent caps"
            git push origin HEAD:main
          fi
