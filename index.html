<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- bioplot-home-banner-early-preload: only for the home route -->
  <script>
    if (location.pathname === '/' || location.pathname === '/index.html') {
      const preload = document.createElement('link');
      preload.rel = 'preload';
      preload.as = 'image';
      preload.setAttribute('imagesrcset', '/images/scientific-design-banner-1280.webp 1280w, /images/scientific-design-banner-1920.webp 1920w');
      preload.setAttribute('imagesizes', '100vw');
      preload.setAttribute('fetchpriority', 'high');
      document.head.appendChild(preload);
    }
  </script>
  <meta name="theme-color" content="#0b7a75" />
  <link rel="canonical" href="https://bioplot.ir/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BioPlot" />
  <meta property="og:title" content="BioPlot — Scientific Figure Design and Graphical Abstracts" />
  <meta property="og:description" content="Scientific illustrations, graphical abstracts and conference posters for researchers." />
  <meta property="og:url" content="https://bioplot.ir/" />
  <meta property="og:image" content="https://bioplot.ir/images/scientific-design-banner-1280.webp" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@graph":[{"@type":"Organization","name":"BioPlot","url":"https://bioplot.ir/"},{"@type":"WebSite","name":"BioPlot","url":"https://bioplot.ir/","inLanguage":["en","fa"]}]}
  </script>
  <!-- SPA fallback serves this file at private routes too: set noindex immediately. -->
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      if (path !== '/' && path !== '/index.html') {
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.remove();
        var robots = document.createElement('meta');
        robots.name = 'robots';
        robots.content = 'noindex, nofollow';
        document.head.appendChild(robots);
      }
    })();
  </script>
  <meta name="description" content="BioPlot designs scientific illustrations, graphical abstracts and research conference posters. Explore examples and request scientific figure design services." />
  <title>BioPlot | Scientific Figure & Graphical Abstract Design</title>
  <script defer src="/bioplot-analytics.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
